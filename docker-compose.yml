# ============================================================================
# Slowbooks Pro 2026 — Docker Compose
# Usage: docker compose up
# ============================================================================

services:
  postgres:
    image: postgres:17-alpine
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=100
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-bookkeeper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookkeeper}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Bound to loopback on the HOST. "5433:5432" would publish on
      # 0.0.0.0, putting the payroll database on every network this machine
      # is attached to. Override BIND_ADDR only when you actually intend
      # that (e.g. BIND_ADDR=0.0.0.0 for a deliberate LAN test box).
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"

  slowbooks:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookkeeper}:${POSTGRES_PASSWORD:-bookkeeper}@postgres:5432/${POSTGRES_DB:-bookkeeper}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-bookkeeper}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bookkeeper}
      APP_HOST: "0.0.0.0"
      APP_PORT: "3001"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_WORKERS: "${APP_WORKERS:-2}"
      # Python 3.13 experimental JIT - uncomment for ~5-10% extra on hot loops
      # PYTHON_JIT: "1"
    ports:
      # Same reasoning as postgres above: loopback by default, so
      # `docker compose up` does not hand the app to the LAN. The container
      # still binds 0.0.0.0 INTERNALLY — that is required for Docker's port
      # forwarding to reach it at all.
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-3001}:3001"
    volumes:
      - slowbooks_uploads:/app/app/static/uploads
      - slowbooks_backups:/app/backups

volumes:
  postgres_data:
  slowbooks_uploads:
  slowbooks_backups:
