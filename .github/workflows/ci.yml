name: CI

on:
  push:
    branches: [main, server-edition, feat/v2.8, "claude/**", "se/**"]
  pull_request:
    branches: [main, server-edition, feat/v2.8]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "black>=26.3.1,<27" "ruff>=0.6,<0.7"
      # Whole-tree gate. The earlier allowlist existed because legacy
      # phases (1-3 routes, legacy services) carried pre-black-era style
      # and would have churned on a wholesale widening. The production-
      # readiness sweep formatted everything to black 24.8 / ruff 0.6,
      # so the gate now protects every file from regression — no risk
      # of a new file slipping through unformatted.
      #
      # Both tools are pinned to the minor series the tree was swept
      # against. They were previously floating (">=0.6.0"), which meant
      # every CI run installed whatever was newest: ruff 0.16 widened its
      # default rule set and reported 2526 findings on an unchanged tree
      # (426 of them B008, which flags FastAPI's own Depends() idiom),
      # turning the gate red and blocking `test` via needs: lint.
      # Upgrade deliberately, with the sweep, not implicitly on a Tuesday.
      - name: black --check
        run: black --check app/ tests/ scripts/ packaging/ migrations/
      - name: ruff check
        run: ruff check app/ tests/ scripts/ packaging/ migrations/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: System deps for WeasyPrint + OCR integration tests
        run: |
          sudo apt-get update
          # libjpeg62-turbo was dropped from Ubuntu 24.04 (noble); Pillow
          # ships bundled JPEG support so we don't need a system libjpeg
          # for the runtime path. The remaining packages are what
          # WeasyPrint's cairo/pango stack pulls in.
          # tesseract-ocr + poppler-utils are needed for the integration
          # tests in tests/test_ocr_integration.py (real OCR pipeline).
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            libxml2 libxslt1.1 \
            tesseract-ocr poppler-utils
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        env:
          # Quoted because the value contains colons (sqlite:///:memory:)
          # — unquoted, YAML mis-parses "sqlite:" as a nested mapping key
          # and the entire workflow fails validation at startup.
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
          MIGRATION_TEST_DATABASE_URL: "postgresql://migration_test:migration_test@localhost:5432/postgres"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - name: Frontend controller regressions
        run: node --test tests/frontend/*.test.cjs
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # `act` sets ACT; its artifact server rejects upload-artifact v7
        # (nektos/act#6022). Always runs on GitHub.
        if: ${{ always() && !env.ACT }}
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The suite on Windows (issue #121).
  #
  # Why this job exists: pytest ran on Linux only, and the Windows build
  # workflow never ran the suite at all. A reader on Windows found eight tests
  # that failed there and nowhere else (#119, note 2) — an encoding class that
  # was green on every pull request and broken for anyone on that platform.
  #
  # It became possible once WeasyPrint's import went lazy: importing the app no
  # longer needs pango/cairo/gobject, so no GTK staging is required here. And it
  # became green once six portability defects in the tests were fixed, plus one
  # real product bug they were reporting honestly (attachment paths stored with
  # the platform separator).
  #
  # Deliberately WITHOUT tesseract and poppler. The Linux job installs both and
  # runs the OCR integration tests; this job is here to catch platform
  # assumptions — path separators, executable formats, `sys.platform` — and a
  # smaller surface makes it faster and less prone to unrelated breakage. The
  # skip count is therefore higher here than on Linux by design. If it changes,
  # something changed in the suite, not in the runner.
  #
  # Verified on real Windows before wiring: 2030 tests, 0 failed, 65 skipped.
  #
  # October 2026, after this branch absorbed upstream 2.19.0: about 6,600
  # tests, 178 skipped (budget 99 -> 185). The extra skips are this branch's
  # own tests, not a regression: 90 are PDF-rendering tests that skip because
  # the runner has no WeasyPrint native stack (pango/cairo, see
  # tests/conftest.py), and most of the rest are PostgreSQL-only tests
  # (concurrency, row locks, schema repair, staged payroll) that need
  # MIGRATION_TEST_DATABASE_URL, which only the Linux job provides. Installing
  # GTK here would turn the PDF skips into coverage, at the cost of the "no
  # staging" simplicity above; until then the budget names the number
  # honestly rather than hiding it.
  # ---------------------------------------------------------------------------
  test-windows:
    name: Test on Windows (portability)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-timeout
      - name: Run pytest, and refuse a quiet rise in skips
        # A portability job's worst failure mode is staying green while
        # covering less, so the skip count is a budget rather than a
        # curiosity. 65 is what real Windows produced when this was wired
        # (macOS-only tests, and the OCR/PDF paths whose binaries this image
        # deliberately does not carry). A rise means something started
        # skipping that used to run — investigate before raising the number.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
          # 90 observed at 2.18.0: the explore-2.17.3 fixes added PDF tests (bills, purchase
          # orders, credit memos, reconciliation reports, tax forms, report footers, the
          # invoice header, emailed statements) that skip where WeasyPrint's native stack
          # is absent, as this image is by design. 74 before them; room for one more guard.
          # +3: tests/test_theme_contrast.py, tests/test_dialog_contrast.py and
          # tests/test_readonly_browser.py each skip as one module without playwright, as
          # tests/test_browser_ui.py does.
          # +1: tests/test_field_names.py (#198) skips as one module without playwright too.
          # +1: tests/test_combobox.py (type-ahead pickers), the same.
          MAX_SKIPS: "185"
        shell: pwsh
        run: |
          # -v names each test as it starts, so a mid-run death is identified
          # in the log rather than guessed at. The timeout is generous because
          # the alembic migration tests walk 36 migrations against a real file
          # and take ~3 s on Linux but far longer here — a Windows runner's
          # file I/O with real-time scanning is the difference. 300 s catches a
          # genuine hang without failing an honestly slow test.
          pytest -q --timeout=300 --tb=short | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = ($out | Select-String -Pattern '\d+ passed').Line
          Write-Host "summary: $line"
          if ($line -match '(\d+) skipped') {
            $skips = [int]$Matches[1]
            Write-Host "skipped: $skips (budget $env:MAX_SKIPS)"
            if ($skips -gt [int]$env:MAX_SKIPS) {
              Write-Error "skip count $skips exceeds the budget of $env:MAX_SKIPS — something that used to run is now skipping"
              exit 1
            }
          }

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      # PR gate. The weekly cron in pip-audit.yml is for catching CVEs
      # disclosed AFTER a release shipped; this step prevents introducing
      # a known-vulnerable dep via PR. Strict mode, so anything NEW fails
      # the build. WeasyPrint 69.0 removed the last temporary exception,
      # so the audit now has no ignored advisories.
      - name: Audit requirements.txt
        run: pip-audit --requirement requirements.txt --strict

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build image
        run: docker build -t slowbooks-pro-ci:${{ github.sha }} .
      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python slowbooks-pro-ci:${{ github.sha }} \
            -c "import app.main; print('import OK')"
