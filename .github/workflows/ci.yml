name: CI

on:
  push:
    branches: [main, server-edition, feat/v2.8, "claude/**", "se/**"]
  pull_request:
    branches: [main, server-edition, feat/v2.8]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "black>=26.3.1,<27" "ruff>=0.6,<0.7"
      # Whole-tree gate. The earlier allowlist existed because legacy
      # phases (1-3 routes, legacy services) carried pre-black-era style
      # and would have churned on a wholesale widening. The production-
      # readiness sweep formatted everything to black 24.8 / ruff 0.6,
      # so the gate now protects every file from regression — no risk
      # of a new file slipping through unformatted.
      #
      # Both tools are pinned to the minor series the tree was swept
      # against. They were previously floating (">=0.6.0"), which meant
      # every CI run installed whatever was newest: ruff 0.16 widened its
      # default rule set and reported 2526 findings on an unchanged tree
      # (426 of them B008, which flags FastAPI's own Depends() idiom),
      # turning the gate red and blocking `test` via needs: lint.
      # Upgrade deliberately, with the sweep, not implicitly on a Tuesday.
      - name: black --check
        run: black --check app/ tests/ scripts/
      - name: ruff check
        run: ruff check app/ tests/ scripts/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System deps for WeasyPrint + OCR integration tests
        run: |
          sudo apt-get update
          # libjpeg62-turbo was dropped from Ubuntu 24.04 (noble); Pillow
          # ships bundled JPEG support so we don't need a system libjpeg
          # for the runtime path. The remaining packages are what
          # WeasyPrint's cairo/pango stack pulls in.
          # tesseract-ocr + poppler-utils are needed for the integration
          # tests in tests/test_ocr_integration.py (real OCR pipeline).
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev \
            libxml2 libxslt1.1 \
            tesseract-ocr poppler-utils
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        env:
          # Quoted because the value contains colons (sqlite:///:memory:)
          # — unquoted, YAML mis-parses "sqlite:" as a nested mapping key
          # and the entire workflow fails validation at startup.
          DATABASE_URL: "sqlite:///:memory:"
          SESSION_SECRET_KEY: ci-secret-key
          RATE_LIMIT_ENABLED: "0"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      # PR gate. The weekly cron in pip-audit.yml is for catching CVEs
      # disclosed AFTER a release shipped; this step prevents introducing
      # a known-vulnerable dep via PR. Strict mode, so anything NEW fails
      # the build. Ignores are per-ID and must carry a reason.
      #
      # PYSEC-2026-3412 — weasyprint 68.1, CSS injection via unescaped
      # attribute values. Ignored on two grounds, not one:
      #   1. NO FIXED RELEASE EXISTS. There is no version to upgrade to,
      #      so failing here blocks every PR indefinitely without making
      #      anything safer.
      #   2. NOT APPLICABLE. The advisory requires HTML presentational
      #      hints to be enabled; every call site in app/services/ uses
      #      write_pdf() with the default False. That is a call-site
      #      property one edit could undo, so it is pinned by
      #      tests/test_pdf_security.py rather than left to chance.
      # Re-check when weasyprint ships a fix — the step below fails on
      # purpose the moment one is available.
      - name: Audit requirements.txt
        run: |
          pip-audit --requirement requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3412

      # The ignore above is only justified while weasyprint has no fix.
      # This fails as soon as that stops being true, so the exception gets
      # removed deliberately instead of outliving its reason.
      - name: Fail if the ignored advisory becomes fixable
        run: |
          pip-audit --requirement requirements.txt --format json \
            --progress-spinner off > audit.json || true
          python - <<'EOF'
          import json, sys
          data = json.load(open("audit.json"))
          for dep in data.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  if vuln.get("id") == "PYSEC-2026-3412" and vuln.get("fix_versions"):
                      sys.exit(
                          "PYSEC-2026-3412 now has a fix "
                          f"({', '.join(vuln['fix_versions'])}). Upgrade weasyprint "
                          "and delete the --ignore-vuln from .github/workflows/."
                      )
          print("PYSEC-2026-3412 still has no fixed release; ignore remains valid.")
          EOF

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t slowbooks-pro-ci:${{ github.sha }} .
      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python slowbooks-pro-ci:${{ github.sha }} \
            -c "import app.main; print('import OK')"
