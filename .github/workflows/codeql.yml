name: "CodeQL"

on:
  push:
    branches: [main, feat/v2.8]
  pull_request:
    branches: [main, server-edition, feat/v2.8]
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 6am UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # CodeQL's analyze step uploads to GitHub code scanning, which requires
    # Advanced Security — NOT enabled on forks. Running it there fails every
    # time ("Code scanning is not enabled for this repository"), which is the
    # red X you see on the fork. Skip on forks; it still runs on the upstream
    # repo where code scanning is configured.
    if: ${{ !github.event.repository.fork }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
