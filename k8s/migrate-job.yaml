# Schema migrations, run exactly once per deploy.
#
# This exists because app pods set RUN_MIGRATIONS=0. If every replica ran
# `alembic upgrade head` on rollout they would contend for the same version
# row, and the losers can exit non-zero mid-rollout — a self-inflicted
# outage that only appears once you scale past one pod.
#
# Re-run on every image change. A Job's pod template is immutable, so
# delete before re-applying:
#   kubectl delete job slowbooks-migrate -n slowbooks --ignore-not-found
#   kubectl apply -k k8s/
#   kubectl wait --for=condition=complete job/slowbooks-migrate -n slowbooks --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: slowbooks-migrate
  namespace: slowbooks
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: slowbooks-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # The headless Postgres service has no DNS record until its pod is
      # ready; wait (up to ~5 min) instead of spending the Job's retries.
      initContainers:
        - name: wait-for-db
          image: slowbooks:2.19.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until pg_isready -h slowbooks-postgres -p 5432 -t 3; do
                i=$((i + 1)); [ "$i" -ge 100 ] && exit 1; sleep 3
              done
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { memory: "64Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      containers:
        - name: migrate
          image: slowbooks:2.19.0
          imagePullPolicy: IfNotPresent
          # Bypass the entrypoint: no server, just schema + seed.
          command: ["/bin/sh", "-c"]  # Alpine image: busybox sh, no bash
          args:
            - |
              set -e
              echo "Applying migrations..."
              alembic upgrade head
              echo "Seeding (idempotent)..."
              python scripts/seed_database.py
              echo "Done."
          envFrom:
            - configMapRef:
                name: slowbooks-config
            - secretRef:
                name: slowbooks-secrets
          env:
            # The startup HTTPS guard is a server concern; this pod serves
            # nothing. Left true it would fail a schema migration over a
            # check about redirect behaviour it never performs.
            - name: FORCE_HTTPS
              value: "false"
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/slowbooks/.cache
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
