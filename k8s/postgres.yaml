# Self-contained Postgres for clusters without a managed database.
#
# If you have RDS / Cloud SQL / Azure Database, delete this file and point
# DATABASE_URL in the Secret at it. That is the better option: this
# StatefulSet has no automated backup, failover, or point-in-time restore.
apiVersion: v1
kind: Service
metadata:
  name: slowbooks-postgres
  namespace: slowbooks
spec:
  clusterIP: None
  selector:
    app: slowbooks-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slowbooks-postgres
  namespace: slowbooks
spec:
  serviceName: slowbooks-postgres
  replicas: 1
  selector:
    matchLabels:
      app: slowbooks-postgres
  template:
    metadata:
      labels:
        app: slowbooks-postgres
    spec:
      # postgres:17-alpine runs as postgres = uid/gid 70 (999 is the Debian image).
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      # DATABASE_URL uses sslmode=require, so this server must speak TLS. A
      # self-signed pair is generated per pod start (the app image carries
      # Python's cryptography; the postgres image has no openssl binary).
      # sslmode=require encrypts without verifying the certificate; for
      # verify-full, mount a CA-issued pair from a Secret at /tls instead.
      initContainers:
        - name: tls-cert
          image: slowbooks:2.19.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import datetime, os
              from cryptography import x509
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import ec
              from cryptography.x509.oid import NameOID
              key = ec.generate_private_key(ec.SECP256R1())
              name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, "slowbooks-postgres")])
              now = datetime.datetime.now(datetime.timezone.utc)
              cert = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
                      .public_key(key.public_key()).serial_number(x509.random_serial_number())
                      .not_valid_before(now - datetime.timedelta(minutes=5))
                      .not_valid_after(now + datetime.timedelta(days=825))
                      .add_extension(x509.SubjectAlternativeName([x509.DNSName("slowbooks-postgres")]), critical=False)
                      .sign(key, hashes.SHA256()))
              with open("/tls/server.crt", "wb") as f:
                  f.write(cert.public_bytes(serialization.Encoding.PEM))
              fd = os.open("/tls/server.key", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "wb") as f:
                  f.write(key.private_bytes(serialization.Encoding.PEM,
                          serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tls
              mountPath: /tls
      containers:
        - name: postgres
          image: postgres:17-alpine
          args: ["postgres", "-c", "ssl=on",
                 "-c", "ssl_cert_file=/tls/server.crt",
                 "-c", "ssl_key_file=/tls/server.key"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bookkeeper
            - name: POSTGRES_DB
              value: slowbooks
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slowbooks-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bookkeeper", "-d", "slowbooks"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bookkeeper", "-d", "slowbooks"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
