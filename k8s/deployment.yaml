apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowbooks
  namespace: slowbooks
spec:
  # Pinned at 1 because uploads/backups use ReadWriteOnce volumes, which a
  # second pod cannot mount. Raise this ONLY after switching pvc.yaml to
  # ReadWriteMany — otherwise the new pods sit Pending on volume attach.
  replicas: 1
  strategy:
    # RollingUpdate would try to start a second pod holding the same RWO
    # volume; it blocks until the old one dies, which reads as a stuck
    # rollout. Recreate is honest about the single-replica constraint.
    # Switch to RollingUpdate together with RWX + replicas > 1.
    type: Recreate
  selector:
    matchLabels:
      app: slowbooks
  template:
    metadata:
      labels:
        app: slowbooks
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: slowbooks
          image: slowbooks:2.18.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: slowbooks-config
            - secretRef:
                name: slowbooks-secrets
          # /health is on the auth-exempt list in app/main.py, so probes do
          # not need credentials. With FORCE_HTTPS on, plain-HTTP /health
          # answers 307 to https:// on this same port; an httpGet probe follows
          # that redirect into a TLS handshake the pod does not serve (TLS ends
          # at the ingress) and the pod never becomes ready. The Compose
          # healthcheck script accepts 200/307/308 without following.
          startupProbe:
            exec: { command: ["python", "/app/scripts/docker_healthcheck.py"] }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30   # up to 150s for a cold start
          readinessProbe:
            exec: { command: ["python", "/app/scripts/docker_healthcheck.py"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["python", "/app/scripts/docker_healthcheck.py"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: uploads
              mountPath: /app/app/static/uploads
            - name: backups
              mountPath: /app/backups
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/slowbooks/.cache
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: slowbooks-uploads
        - name: backups
          persistentVolumeClaim:
            claimName: slowbooks-backups
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
