# Template. Do NOT commit a filled-in copy.
#
# Generate real values:
#   PAYROLL_ENCRYPTION_SECRET   openssl rand -base64 32
#   SESSION_SECRET_KEY          openssl rand -hex 32
#   POSTGRES_PASSWORD           openssl rand -base64 24
#
# Create it without a file touching disk:
#   kubectl create secret generic slowbooks-secrets -n slowbooks \
#     --from-literal=PAYROLL_ENCRYPTION_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=SESSION_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=DATABASE_URL="postgresql://bookkeeper:PASS@slowbooks-postgres:5432/slowbooks?sslmode=require"
#
# CORS_ALLOW_ORIGINS is NOT here — it is your own public origin, not a
# credential, so it lives in configmap.yaml.
#
# PAYROLL_ENCRYPTION_SECRET is not rotatable casually: it decrypts employee
# bank PII and the benefits ePHI. Losing it loses that data. Back it up
# somewhere that is not this cluster. To rotate, set
# PAYROLL_ENCRYPTION_SECRET_PREV to the old value and run the rewrap CLI.
apiVersion: v1
kind: Secret
metadata:
  name: slowbooks-secrets
  namespace: slowbooks
type: Opaque
stringData:
  PAYROLL_ENCRYPTION_SECRET: "REPLACE_ME"
  SESSION_SECRET_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "postgresql://bookkeeper:REPLACE_ME@slowbooks-postgres:5432/slowbooks?sslmode=require"
  # A tax identifier rather than a credential, but it does not belong in a
  # ConfigMap that anyone with namespace read can dump.
  EMPLOYER_EIN: ""
